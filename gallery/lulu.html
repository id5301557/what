<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LULU / PHOTO ARCHIVE</title>
<style>
:root{--accent:#708d79;--paper:#f6f8f5;--ink:#243129;--muted:#738077;--line:#d7e0d9;--amber:#c5a365}
*{box-sizing:border-box}body{margin:0;background:#edf3ee;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;word-break:keep-all}
a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;height:64px;padding:0 clamp(18px,4vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(246,249,246,.9);backdrop-filter:blur(14px)}
.top a,.top span{color:var(--muted);font:700 10px/1 monospace;letter-spacing:.1em}.wrap{width:min(1180px,calc(100% - 28px));margin:42px auto 100px}
.head{padding:34px clamp(22px,5vw,56px);border:1px solid var(--line);border-bottom:3px solid var(--accent);background:#fff}.kicker{color:var(--accent);font:800 10px/1 monospace;letter-spacing:.11em}
h1{margin:14px 0 0;font:900 clamp(48px,8vw,100px)/.88 "Arial Narrow",Arial,sans-serif;letter-spacing:-.055em}.sub{margin-top:12px;color:#8a968e;font:700 9px/1 monospace;letter-spacing:.08em}
.album-grid{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.photo{position:relative;margin:0;min-height:360px;border:1px solid var(--line);background:#fff;overflow:hidden}.photo.hero-photo{grid-column:span 2;grid-row:span 2;min-height:740px}.photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom;background:#fafcf9}
.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 10px;background:rgba(247,249,247,.84);border:1px solid rgba(215,224,217,.8);backdrop-filter:blur(8px);font:700 8px/1.35 monospace;letter-spacing:.08em;color:#718078}
.placeholder{display:flex;align-items:center;justify-content:center;min-height:360px;color:#a6b0aa;background:repeating-linear-gradient(135deg,#f8faf8,#f8faf8 12px,#f3f6f3 12px,#f3f6f3 24px);font:700 9px/1.5 monospace;letter-spacing:.1em;text-align:center}
.tip{margin-top:20px;padding:18px 20px;border:1px dashed #cad5cd;color:#89958d;background:rgba(255,255,255,.5);font-size:12px;line-height:1.75}.tip code{font-family:monospace;color:var(--accent)}
.archive{background:#101411;color:#ddd8cd}.archive .top{background:rgba(16,20,17,.9);border-color:rgba(197,163,101,.2)}.archive .top a,.archive .top span{color:#8e8779}.archive .head{background:#151a17;border-color:rgba(197,163,101,.33);border-bottom-color:var(--amber)}.archive .kicker{color:var(--amber)}.archive h1{color:#d0b06d}.archive .sub{color:#7f7a70}.archive .photo{background:#131713;border-color:rgba(197,163,101,.22)}.archive .photo img{background:#101411}.archive .caption{color:#b5aa95;background:rgba(15,19,16,.83);border-color:rgba(197,163,101,.22)}.archive .placeholder{color:#777368;background:repeating-linear-gradient(135deg,#111512,#111512 12px,#151a17 12px,#151a17 24px)}.archive .tip{border-color:rgba(197,163,101,.24);color:#888276;background:#131713}.archive .tip code{color:var(--amber)}
@media(max-width:760px){.album-grid{grid-template-columns:1fr}.photo.hero-photo{grid-column:auto;grid-row:auto;min-height:560px}.photo,.placeholder{min-height:300px}}

/* v5 / ID portrait as FILE 001 */
.photo.hero-photo.id-portrait{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 34%,rgba(255,255,255,.88) 0 15%,rgba(255,255,255,.32) 48%,transparent 74%),
    var(--portrait-bg,#eef3ee);
}
.photo.hero-photo.id-portrait::before{
  content:"CIVIC REGISTRY / IDENTIFICATION PORTRAIT";
  position:absolute;
  z-index:2;
  top:18px;
  left:20px;
  color:rgba(60,77,66,.38);
  font:700 8px/1 monospace;
  letter-spacing:.11em;
}
.photo.hero-photo.id-portrait img{
  width:auto;
  height:auto;
  max-width:92%;
  max-height:88%;
  object-fit:contain;
  object-position:center bottom;
  background:transparent;
  filter:drop-shadow(0 20px 24px rgba(38,53,43,.07));
}
.archive .photo.hero-photo.id-portrait{
  background:
    repeating-linear-gradient(0deg,transparent 0,transparent 5px,rgba(255,255,255,.018) 6px),
    radial-gradient(circle at 50% 34%,rgba(151,164,135,.09),transparent 55%),
    var(--portrait-bg,#202620);
}
.archive .photo.hero-photo.id-portrait::before{
  content:"SHELTER NO.435 / PERSONNEL IDENTIFICATION";
  color:rgba(202,174,115,.46);
}
.archive .photo.hero-photo.id-portrait img{
  background:transparent;
  filter:drop-shadow(0 20px 28px rgba(0,0,0,.28));
}
@media(max-width:760px){
  .photo.hero-photo.id-portrait img{
    max-width:98%;
    max-height:92%;
  }
}


/* v6 / mobile portrait compact layout */
@media(max-width:760px){
  .wrap{
    margin-top:20px;
  }

  .album-grid{
    margin-top:12px;
  }

  /* old full-body layout left too much vertical room for ID portraits */
  .photo.hero-photo.id-portrait{
    grid-column:auto;
    grid-row:auto;
    min-height:0;
    height:clamp(340px,92vw,430px);
  }

  .photo.hero-photo.id-portrait img{
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
  }

  .photo.hero-photo.id-portrait::before{
    top:10px;
    left:12px;
    font-size:7px;
  }

  .caption{
    left:8px;
    right:8px;
    bottom:8px;
    padding:7px 8px;
  }
}


/* v7 / cross-reference to character detail record */
.profile-link{
  margin-top:20px;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border:1px solid color-mix(in srgb,var(--accent) 34%,#d7e0d9);
  background:color-mix(in srgb,var(--accent) 5%,#fff);
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.profile-link span{
  color:#8a968e;
  font:700 8px/1 monospace;
  letter-spacing:.09em;
}
.profile-link b{
  color:var(--accent);
  font:800 9px/1 monospace;
  letter-spacing:.09em;
}
.profile-link:hover{
  transform:translateX(3px);
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,#fff);
}
.archive .profile-link{
  border-color:rgba(197,163,101,.25);
  background:rgba(197,163,101,.035);
}
.archive .profile-link span{color:#777368}
.archive .profile-link b{color:var(--amber)}
.archive .profile-link:hover{
  border-color:rgba(197,163,101,.52);
  background:rgba(197,163,101,.07);
}
@media(max-width:760px){
  .profile-link{
    margin-top:15px;
    padding:12px;
  }
  .profile-link span{
    display:none;
  }
  .profile-link b{
    width:100%;
    text-align:right;
  }
}


/* v8 / desktop gallery balance
   FILE 001 portrait = 1/3, FILE 002 landscape = 2/3 */
@media(min-width:761px){
  .album-grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
    align-items:stretch;
  }

  /* FILE 001 / ID portrait */
  .photo.hero-photo.id-portrait{
    grid-column:span 2;
    grid-row:auto;
    min-height:0;
    height:520px;
  }

  /* FILE 002 / work or field photo */
  .album-grid > :nth-child(2){
    grid-column:span 4;
    min-height:0;
    height:520px;
  }

  /* FILE 003–005 */
  .album-grid > :nth-child(n+3){
    grid-column:span 2;
    min-height:360px;
  }

  /* Landscape records should use the available wide frame */
  .album-grid > :nth-child(2) img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
  }

  /* Portrait stays centered without becoming oversized */
  .photo.hero-photo.id-portrait img{
    max-width:96%;
    max-height:94%;
    object-position:center center;
  }
}


/* v9 / desktop image flush fill
   Make FILE 001 and FILE 002 visible image areas the same height */
@media(min-width:761px){
  /* Both first-row cards keep exactly the same frame height */
  .photo.hero-photo.id-portrait,
  .album-grid > :nth-child(2){
    height:520px;
    min-height:520px;
  }

  /* ID portrait:
     square source fills the full vertical frame.
     Excess width is cropped by the card instead of leaving top whitespace. */
  .photo.hero-photo.id-portrait{
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .photo.hero-photo.id-portrait img{
    width:auto;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
    flex:none;
  }

  /* FILE 002:
     fill the full wide frame, removing thin top/bottom letterboxing. */
  .album-grid > :nth-child(2){
    overflow:hidden;
  }

  .album-grid > :nth-child(2) img{
    display:block;
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:cover;
    object-position:center center;
  }
}


/* v10 / responsive portrait + landscape balance
   Desktop: keep 1/3 + 2/3 same-height layout.
   Mobile: portrait narrower, landscape full-width with natural aspect ratio. */

/* PC / tablet landscape */
@media(min-width:761px){
  .photo.hero-photo.id-portrait{
    grid-column:span 2;
    height:520px;
    min-height:520px;
  }

  .album-grid > :nth-child(2){
    grid-column:span 4;
    height:520px;
    min-height:520px;
  }

  .photo.hero-photo.id-portrait img{
    width:auto;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
  }

  .album-grid > :nth-child(2) img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }
}

/* Mobile */
@media(max-width:760px){
  .album-grid{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* FILE 001 — slightly narrower portrait card */
  .photo.hero-photo.id-portrait{
    width:82%;
    align-self:center;
    height:auto;
    min-height:0;
    aspect-ratio:4 / 5;
  }

  .photo.hero-photo.id-portrait img{
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:cover;
    object-position:center center;
  }

  /* FILE 002 — full-width landscape card using source-like ratio */
  .album-grid > :nth-child(2){
    width:100%;
    align-self:stretch;
    height:auto;
    min-height:0;
    aspect-ratio:2047 / 950;
  }

  .album-grid > :nth-child(2) img{
    display:block;
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:cover;
    object-position:center center;
  }

  /* FILE 003–005 keep normal mobile cards */
  .album-grid > :nth-child(n+3){
    width:100%;
    align-self:stretch;
  }
}


/* v11 / mobile natural-ratio correction
   No forced aspect ratios on mobile. Let each image define its own height. */
@media(max-width:760px){
  .album-grid{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* FILE 001 / ID portrait
     Smaller than the landscape record, but keep the source's own ratio. */
  .photo.hero-photo.id-portrait{
    display:block;
    width:72%;
    max-width:430px;
    align-self:center;
    height:auto;
    min-height:0;
    aspect-ratio:auto;
    overflow:hidden;
  }

  .photo.hero-photo.id-portrait img{
    display:block;
    width:100%;
    height:auto;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
  }

  /* FILE 002 / work record
     Full width, natural source ratio: no letterboxing and no artificial height. */
  .album-grid > :nth-child(2){
    display:block;
    width:100%;
    align-self:stretch;
    height:auto;
    min-height:0;
    aspect-ratio:auto;
    overflow:hidden;
  }

  .album-grid > :nth-child(2) img{
    display:block;
    width:100%;
    height:auto;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
  }

  /* Remaining files keep the normal mobile archive layout. */
  .album-grid > :nth-child(n+3){
    width:100%;
    align-self:stretch;
  }
}

</style>
</head>
<body class="" style="--accent:#db7fb1">
<header class="top">
  <a href="../gallery.html">← ALL ARCHIVES</a>
  <span>LULU / PHOTO ARCHIVE</span>
</header>
<main class="wrap">
  <section class="head">
    <div class="kicker">CITY NETWORK · PERSONAL PHOTO ARCHIVE</div>
    <h1>LULU</h1>
    <div class="sub">루루 · LEPORID · VISUAL FILE COLLECTION</div>
    <a class="profile-link" href="../profiles/lulu.html">
      <span>RELATED CIVIC RECORD</span>
      <b>OPEN CIVIC PROFILE →</b>
    </a>
  </section>

  <section class="album-grid">
    <figure class="photo hero-photo id-portrait" style="--portrait-bg:#FBEDF5">
      <img src="../images/portraits/lulu.webp" alt="루루 증명사진">
      <figcaption class="caption">FILE 001 / ID PORTRAIT / CIVIC REGISTRY</figcaption>
    </figure>

    <figure class="photo">
      <img src="../images/gallery/lulu/002.webp" alt="루루 직업 및 생활 기록 사진" loading="lazy">
      <figcaption class="caption">FILE 002 / DAILY WORK RECORD</figcaption>
    </figure>
    <figure class="photo">
      <img src="../images/gallery/lulu/003.webp" alt="루루 취미 기록 사진" loading="lazy">
      <figcaption class="caption">FILE 003 / HOBBY RECORD</figcaption>
    </figure>
    <figure class="photo">
      <img src="../images/gallery/lulu/004.webp" alt="루루 수영복 기록 사진" loading="lazy">
      <figcaption class="caption">FILE 004 / SUMMER RECORD</figcaption>
    </figure>
    <figure class="photo">
      <img src="../images/gallery/lulu/005.webp" alt="루루 개인 기록 사진" loading="lazy">
      <figcaption class="caption">FILE 005 / PERSONAL RECORD</figcaption>
    </figure>
  </section>

</main>
</body>
</html>
