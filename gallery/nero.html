<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NERO / PHOTO ARCHIVE</title>
<style>
:root{--accent:#708d79;--paper:#f6f8f5;--ink:#243129;--muted:#738077;--line:#d7e0d9;--amber:#c5a365}
*{box-sizing:border-box}body{margin:0;background:#edf3ee;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;word-break:keep-all}
a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;height:64px;padding:0 clamp(18px,4vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(246,249,246,.9);backdrop-filter:blur(14px)}
.top a,.top span{color:var(--muted);font:700 10px/1 monospace;letter-spacing:.1em}.wrap{width:min(1180px,calc(100% - 28px));margin:42px auto 100px}
.head{padding:34px clamp(22px,5vw,56px);border:1px solid var(--line);border-bottom:3px solid var(--accent);background:#fff}.kicker{color:var(--accent);font:800 10px/1 monospace;letter-spacing:.11em}
h1{margin:14px 0 0;font:900 clamp(48px,8vw,100px)/.88 "Arial Narrow",Arial,sans-serif;letter-spacing:-.055em}.sub{margin-top:12px;color:#8a968e;font:700 9px/1 monospace;letter-spacing:.08em}
.album-grid{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.photo{position:relative;min-height:360px;border:1px solid var(--line);background:#fff;overflow:hidden}.photo.hero-photo{grid-column:span 2;grid-row:span 2;min-height:740px}.photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom;background:#fafcf9}
.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 10px;background:rgba(247,249,247,.84);border:1px solid rgba(215,224,217,.8);backdrop-filter:blur(8px);font:700 8px/1.35 monospace;letter-spacing:.08em;color:#718078}
.placeholder{display:flex;align-items:center;justify-content:center;min-height:360px;color:#a6b0aa;background:repeating-linear-gradient(135deg,#f8faf8,#f8faf8 12px,#f3f6f3 12px,#f3f6f3 24px);font:700 9px/1.5 monospace;letter-spacing:.1em;text-align:center}
.tip{margin-top:20px;padding:18px 20px;border:1px dashed #cad5cd;color:#89958d;background:rgba(255,255,255,.5);font-size:12px;line-height:1.75}.tip code{font-family:monospace;color:var(--accent)}
.archive{background:#101411;color:#ddd8cd}.archive .top{background:rgba(16,20,17,.9);border-color:rgba(197,163,101,.2)}.archive .top a,.archive .top span{color:#8e8779}.archive .head{background:#151a17;border-color:rgba(197,163,101,.33);border-bottom-color:var(--amber)}.archive .kicker{color:var(--amber)}.archive h1{color:#d0b06d}.archive .sub{color:#7f7a70}.archive .photo{background:#131713;border-color:rgba(197,163,101,.22)}.archive .photo img{background:#101411}.archive .caption{color:#b5aa95;background:rgba(15,19,16,.83);border-color:rgba(197,163,101,.22)}.archive .placeholder{color:#777368;background:repeating-linear-gradient(135deg,#111512,#111512 12px,#151a17 12px,#151a17 24px)}.archive .tip{border-color:rgba(197,163,101,.24);color:#888276;background:#131713}.archive .tip code{color:var(--amber)}
@media(max-width:760px){.album-grid{grid-template-columns:1fr}.photo.hero-photo{grid-column:auto;grid-row:auto;min-height:560px}.photo,.placeholder{min-height:300px}}

/* v5 / ID portrait as FILE 001 */
.photo.hero-photo.id-portrait{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 34%,rgba(255,255,255,.88) 0 15%,rgba(255,255,255,.32) 48%,transparent 74%),
    var(--portrait-bg,#eef3ee);
}
.photo.hero-photo.id-portrait::before{
  content:"CIVIC REGISTRY / IDENTIFICATION PORTRAIT";
  position:absolute;
  z-index:2;
  top:18px;
  left:20px;
  color:rgba(60,77,66,.38);
  font:700 8px/1 monospace;
  letter-spacing:.11em;
}
.photo.hero-photo.id-portrait img{
  width:auto;
  height:auto;
  max-width:92%;
  max-height:88%;
  object-fit:contain;
  object-position:center bottom;
  background:transparent;
  filter:drop-shadow(0 20px 24px rgba(38,53,43,.07));
}
.archive .photo.hero-photo.id-portrait{
  background:
    repeating-linear-gradient(0deg,transparent 0,transparent 5px,rgba(255,255,255,.018) 6px),
    radial-gradient(circle at 50% 34%,rgba(151,164,135,.09),transparent 55%),
    var(--portrait-bg,#202620);
}
.archive .photo.hero-photo.id-portrait::before{
  content:"SHELTER NO.435 / PERSONNEL IDENTIFICATION";
  color:rgba(202,174,115,.46);
}
.archive .photo.hero-photo.id-portrait img{
  background:transparent;
  filter:drop-shadow(0 20px 28px rgba(0,0,0,.28));
}
@media(max-width:760px){
  .photo.hero-photo.id-portrait img{
    max-width:98%;
    max-height:92%;
  }
}


/* v6 / mobile portrait compact layout */
@media(max-width:760px){
  .wrap{
    margin-top:20px;
  }

  .album-grid{
    margin-top:12px;
  }

  /* old full-body layout left too much vertical room for ID portraits */
  .photo.hero-photo.id-portrait{
    grid-column:auto;
    grid-row:auto;
    min-height:0;
    height:clamp(340px,92vw,430px);
  }

  .photo.hero-photo.id-portrait img{
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:contain;
    object-position:center center;
  }

  .photo.hero-photo.id-portrait::before{
    top:10px;
    left:12px;
    font-size:7px;
  }

  .caption{
    left:8px;
    right:8px;
    bottom:8px;
    padding:7px 8px;
  }
}

</style>
</head>
<body class="" style="--accent:#4f7fd8">
<header class="top">
  <a href="../gallery.html">← ALL ARCHIVES</a>
  <span>NERO / PHOTO ARCHIVE</span>
</header>
<main class="wrap">
  <section class="head">
    <div class="kicker">CITY NETWORK · PERSONAL PHOTO ARCHIVE</div>
    <h1>NERO</h1>
    <div class="sub">네로 · SELACHIAN · VISUAL FILE COLLECTION</div>
  </section>

  <section class="album-grid">
    <figure class="photo hero-photo id-portrait" style="--portrait-bg:#E8EFFB">
      <img src="../images/portraits/nero.webp" alt="네로 증명사진">
      <figcaption class="caption">FILE 001 / ID PORTRAIT / CIVIC REGISTRY</figcaption>
    </figure>

    <figure class="photo">
      <img src="../images/gallery/nero/002.webp" alt="NERO 개인 기록 사진" loading="lazy">
      <figcaption class="caption">FILE 002 / PERSONAL RECORD</figcaption>
    </figure>
    <div class="placeholder">ADD PHOTO<br>FILE 003</div>
    <div class="placeholder">ADD PHOTO<br>FILE 004</div>
    <div class="placeholder">ADD PHOTO<br>FILE 005</div>
  </section>

  <div class="tip">
    이후 사진 추가용 자리. 파일은 <code>images/gallery/nero/</code> 폴더에 넣고 이 페이지의 placeholder를 이미지 태그로 교체하면 됨.
  </div>
</main>
</body>
</html>
